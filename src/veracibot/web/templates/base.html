<!doctype html>
<html lang="{{ 'pt-BR' if lang == 'pt' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.title }}</title>
  <meta name="description" content="{{ t.hero_sub }}">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark vb-nav">
    <div class="container">
      <a class="navbar-brand" href="{{ p.home }}">
        <img src="/static/logo.svg" alt="" height="30">
        veraci<span class="brand-dot">.</span>bot
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navMain" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="{{ p.ranking }}">{{ t.nav_ranking }}</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ p.cases }}">{{ t.nav_cases }}</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ p.lawyers }}">{{ t.nav_lawyers }}</a></li>
          <li class="nav-item"><a class="nav-link" href="/login">{{ t.nav_login }}</a></li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-outline-gold btn-sm" href="{{ alt }}">{{ 'EN' if lang == 'pt' else 'PT' }}</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="mt-5 py-4">
    <div class="container small">
      <p class="mb-1"><a href="https://x.com/veracibot">@veracibot</a> · veraci.bot</p>
      <p class="mb-0">{{ t.footer_note }}</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
